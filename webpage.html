<!DOCTYPE html>
<head>
    <title>
        Web Page
    </title>
    <style>
        body{
            background-color: lavenderblush;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h2{
            color: violet;
            margin: 0 0 20px;
        }
        nav{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a{
            min-width: 120px;
            padding: 8px 14px;
            color: violet;
            text-align: center;
            text-decoration: none;
            border: 1px solid violet;
            border-radius: 4px;
        }
        a:hover{
            color: white;
            background-color: violet;
        }
    </style>
</head>
<body>
    <h2>Welcome</h2>
